services:
  - type: web
    name: tom-api
    runtime: python
    rootDir: backend
    buildCommand: pip install -r requirements.txt
    startCommand: gunicorn api_server:app
    healthCheckPath: /api/health
    envVars:
      - key: FLASK_SECRET_KEY
        generateValue: true
      - key: DATABASE_PATH
        value: /var/data/chats.db
    disk:
      name: tom-chat-data
      mountPath: /var/data
      sizeGB: 10
