# Publishes docs/architecture/ as a GitHub Pages site.
# The Archify HTML files are self-contained (no external refs), so the deploy
# is a plain static copy — no build step. Site URL:
#   https://nitingautam2007.github.io/TOM-Chatbot/<file>.html
# One-time setup after the first push:
#   Settings → Pages → Source: "GitHub Actions"
name: Deploy architecture diagrams to GitHub Pages

on:
  push:
    branches: [main, master]
    paths:
      - "docs/architecture/**"
      - ".github/workflows/pages.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: docs/architecture
      - id: deployment
        uses: actions/deploy-pages@v4
